[project]
name = "dexnet"
version = "0.1.0"
description = "DEX-Net: a mechanics-grounded generative event model of Uniswap v3 order flow"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Clayton Barnes" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "pyarrow>=14",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dexnet"]
